
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bypass OTP | Homeland of Testing</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 390px;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      color: #1a73e8;
      font-size: 14px;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 600;
    }

    .description {
      margin-bottom: 28px;
      color: #70757a;
      font-size: 14px;
      line-height: 1.6;
    }

    .otp-inputs {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .otp-inputs input {
      width: 100%;
      min-width: 0;
      height: 60px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      outline: none;
      text-align: center;
      font-size: 24px;
    }

    .otp-inputs input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #1a73e8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success { color: #188038; }
    .error { color: #d93025; }

    .home-link {
      display: inline-block;
      margin-top: 8px;
      color: #1a73e8;
    }

    .note {
      margin-top: 28px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      color: #70757a;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back" href="/">← Homeland of Testing</a>

    <h1>Bypass OTP</h1>
    <p class="description">
      Enter the four-digit OTP and submit a verification request
      to the Homeland of Testing API.
    </p>

    <form id="otpForm">
      <div class="otp-inputs">
        <input inputmode="numeric" maxlength="1" pattern="[0-9]"
               aria-label="First digit" autocomplete="one-time-code" required autofocus>
        <input inputmode="numeric" maxlength="1" pattern="[0-9]"
               aria-label="Second digit" required>
        <input inputmode="numeric" maxlength="1" pattern="[0-9]"
               aria-label="Third digit" required>
        <input inputmode="numeric" maxlength="1" pattern="[0-9]"
               aria-label="Fourth digit" required>
      </div>

      <button id="verifyButton" type="submit">Verify OTP</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <p class="note">
      Educational testing lab. Requests are sent to this site's
      own API endpoint. Do not enter real account credentials.
    </p>
  </main>

  <script>
    const form = document.getElementById("otpForm");
    const inputs = [...document.querySelectorAll(".otp-inputs input")];
    const button = document.getElementById("verifyButton");
    const result = document.getElementById("result");

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);

        if (input.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }

        result.textContent = "";
        result.className = "";
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Backspace" &&
            !input.value && index > 0) {
          inputs[index - 1].focus();
        }

        if (event.key === "ArrowLeft" && index > 0) {
          inputs[index - 1].focus();
        }

        if (event.key === "ArrowRight" &&
            index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const otp = inputs.map(input => input.value).join("");

      if (!/^\d{4}$/.test(otp)) {
        result.textContent = "Enter all four digits.";
        result.className = "error";
        return;
      }

      button.disabled = true;
      button.textContent = "Sending request...";
      result.textContent = "Contacting verification API...";
      result.className = "";

      try {
        const response = await fetch("/api/verify-otp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ otp })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          result.className = "success";
          result.replaceChildren();

          const message = document.createElement("div");
          message.textContent = "You passed the test!";

          const link = document.createElement("a");
          link.className = "home-link";
          link.href = "/";
          link.textContent = "Go to Home";

          result.append(message, link);
        } else {
          result.textContent = data.message ||
            "Verification failed. HTTP " + response.status;
          result.className = "error";
        }
      } catch (error) {
        result.textContent =
          "Request failed. Check the API deployment and browser connection.";
        result.className = "error";
      } finally {
        button.disabled = false;
        button.textContent = "Verify OTP";
      }
    });
  </script>
</body>
</html>
