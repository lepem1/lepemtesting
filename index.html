
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Homeland of Testing — search and explore testing pages.">
  <title>Homeland of Testing</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    header {
      padding: 19px 28px;
      border-bottom: 1px solid #eee;
    }

    .brand {
      color: #202124;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: -.5px;
    }

    main {
      width: min(650px, calc(100% - 36px));
      margin: 75px auto 60px;
    }

    .logo {
      margin-bottom: 27px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 42px);
      font-weight: 400;
      letter-spacing: -1.5px;
    }

    h1 span { font-weight: 700; }

    .subtitle {
      margin-top: 12px;
      color: #70757a;
      text-align: center;
      line-height: 1.6;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      margin-top: 28px;
      padding: 0 16px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      box-shadow: 0 1px 5px #0000000a;
      transition: box-shadow .15s, border-color .15s;
    }

    .search:focus-within,
    .search:hover {
      border-color: transparent;
      box-shadow: 0 1px 6px #20212435;
    }

    .search-icon {
      color: #777;
      font-size: 19px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font: inherit;
      font-size: 16px;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 29px 0 17px;
      color: #70757a;
      font-size: 13px;
    }

    .refresh {
      border: 0;
      background: none;
      color: #1a73e8;
      font: inherit;
      cursor: pointer;
    }

    .refresh:disabled { opacity: .5; }

    #results {
      display: grid;
      gap: 26px;
    }

    .result { min-width: 0; }

    .result-url {
      overflow-wrap: anywhere;
      margin-bottom: 7px;
      color: #188038;
      font-size: 12px;
    }

    .result h2 {
      margin: 0 0 7px;
      font-size: 20px;
      font-weight: 400;
    }

    .result h2 a {
      color: #1a0dab;
      text-decoration: none;
    }

    .result h2 a:hover { text-decoration: underline; }

    .result-description {
      margin: 0;
      color: #4d5156;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .result-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 9px;
    }

    .result-actions a,
    .copy {
      padding: 0;
      border: 0;
      background: none;
      color: #5f6368;
      font: inherit;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .result-actions a:hover,
    .copy:hover { color: #1a73e8; }

    .message {
      padding: 28px 0;
      color: #70757a;
      line-height: 1.7;
    }

    .message strong {
      display: block;
      margin-bottom: 5px;
      color: #202124;
      font-weight: 500;
    }

    footer {
      padding: 22px;
      border-top: 1px solid #eee;
      color: #70757a;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 17px 18px; }
      main { margin-top: 53px; }
      .result h2 { font-size: 18px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="/">Homeland of Testing</a>
  </header>

  <main>
    <div class="logo">
      <h1>Homeland <span>of Testing</span></h1>
      <p class="subtitle">
        Search testing pages, labs, and resources.
      </p>
    </div>

    <label class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="query"
        type="search"
        placeholder="Search pages..."
        autocomplete="off"
        aria-label="Search testing pages"
      >
    </label>

    <div class="summary">
      <span id="count">Loading pages...</span>
      <button class="refresh" id="refresh" type="button">
        Refresh results ↻
      </button>
    </div>

    <div id="results" aria-live="polite">
      <div class="message">Loading your pages...</div>
    </div>
  </main>

  <footer>
    Homeland of Testing · Search your testing directory
  </footer>

  <script>
    const query = document.getElementById("query");
    const results = document.getElementById("results");
    const count = document.getElementById("count");
    const refresh = document.getElementById("refresh");

    let pages = [];
    let loadError = false;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getDescription(page) {
      return page.description || "Open this page on Homeland of Testing.";
    }

    function render() {
      if (loadError) {
        count.textContent = "Pages unavailable";
        results.innerHTML = `
          <div class="message">
            <strong>Could not load the page directory.</strong>
            Check the Vercel API deployment and try refreshing.
          </div>`;
        return;
      }

      const term = query.value.trim().toLowerCase();

      const filtered = pages.filter(page =>
        page.title.toLowerCase().includes(term) ||
        page.filename.toLowerCase().includes(term) ||
        getDescription(page).toLowerCase().includes(term) ||
        page.url.toLowerCase().includes(term)
      );

      count.textContent = term
        ? `${filtered.length} search results`
        : `${pages.length} pages available`;

      if (!filtered.length) {
        results.innerHTML = `
          <div class="message">
            <strong>No pages found</strong>
            Try another search, or add an HTML file to the pages folder
            and deploy your updated project.
          </div>`;
        return;
      }

      results.innerHTML = filtered.map(page => {
        const url = new URL(page.url, location.origin).href;

        return `
          <article class="result">
            <div class="result-url">${escapeHTML(url)}</div>
            <h2>
              <a href="${escapeHTML(page.url)}">
                ${escapeHTML(page.title)}
              </a>
            </h2>
            <p class="result-description">
              ${escapeHTML(getDescription(page))}
            </p>
            <div class="result-actions">
              <a href="${escapeHTML(page.url)}">Open page →</a>
              <button
                class="copy"
                type="button"
                data-copy="${escapeHTML(url)}"
              >Copy URL</button>
            </div>
          </article>`;
      }).join("");
    }

    async function loadPages() {
      refresh.disabled = true;
      count.textContent = "Loading pages...";

      try {
        const response = await fetch("/api/pages", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Page directory request failed");
        }

        const data = await response.json();

        if (!Array.isArray(data.pages)) {
          throw new Error("Invalid directory response");
        }

        pages = data.pages;
        loadError = false;
      } catch (error) {
        loadError = true;
      } finally {
        refresh.disabled = false;
        render();
      }
    }

    query.addEventListener("input", render);
    refresh.addEventListener("click", loadPages);

    results.addEventListener("click", async event => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;

      try {
        await navigator.clipboard.writeText(button.dataset.copy);
        button.textContent = "Copied!";
        setTimeout(() => {
          button.textContent = "Copy URL";
        }, 1500);
      } catch {
        window.prompt("Copy this URL:", button.dataset.copy);
      }
    });

    loadPages();
  </script>
</body>
</html>
